<div id="appModal" class="modal-overlay mus-modal-overlay" onclick="window.closeModalOnOverlay(event)">
    <div class="modal-card mus-modal" onclick="event.stopPropagation()">
        <div class="modal-header mus-header">
            <h3 class="modal-title mus-title" id="appModalTitle"></h3>
            <p class="modal-subtitle mus-subtitle" id="appModalSubtitle" style="display: none;"></p>
            <button type="button" class="modal-close mus-close" onclick="window.closeModal()" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body mus-body" id="appModalBody"></div>
    </div>
</div>

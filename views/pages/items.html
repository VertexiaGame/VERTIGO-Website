<link rel="stylesheet" href="/static/css/forms.css?v={{.AssetV}}">
<link rel="stylesheet" href="/static/css/inputs.css?v={{.AssetV}}">
<link rel="stylesheet" href="/static/css/set.css?v={{.AssetV}}">
<link rel="stylesheet" href="/static/css/dash.css?v={{.AssetV}}">
<link rel="stylesheet" href="/static/css/avt.css?v={{.AssetV}}">
<link rel="stylesheet" href="/static/css/shop.css?v={{.AssetV}}">
<div class="wrap">
    <div class="cont">
        <div class="studs"></div>
        <div class="bar">
            <span class="title">My Items</span>
            <div class="pill">
                <img src="/static/useful/icons/search.png" class="icon" alt="Search">
                <input type="text" class="input" placeholder="search" id="assetSearch" autocomplete="off">
            </div>
            <div class="barbtns">
                <a href="/create?type=shop" hx-get="/create?type=shop" hx-target="body" hx-push-url="true" class="button barbtn" style="text-decoration: none;">Create</a>
                <button hx-get="/" hx-target="body" hx-push-url="true" class="button barbtn">Go back</button>
            </div>
        </div>
        <div class="pane">
            <div class="shp-lay">
                <div class="shp-hdr-block">
                    <h1 class="shp-heading">My Items</h1>
                    <span class="shp-subheading">Items are reviewed by our moderation team before they appear in the shop</span>
                </div>
                <div class="shp-grid" id="assetGrid">
                    {{range .Items}}
                    <div class="shp-card" data-id="{{.ID}}" data-type="{{.Type}}" data-goto="shop-item" tabindex="0" role="link" title="View shop item">
                        <div class="avtitmimg">
                            <img src="/avatar/shop/{{.Type}}/{{.ID}}" alt="{{.Name}}" loading="lazy" class="avtldimg" onerror="this.src='/static/useful/temp/pfp.png';">
                            <span class="avtitmbdg avtitmbdg-{{.ApprovalState}}">{{.ApprovalLabel}}</span>
                        </div>
                        <div class="avtitmmeta">
                            <span class="avtitmnm">{{.Name}}</span>
                            <span class="avtitmcr">{{.TypeName}} {{.CreatedAt.Format "Jan 02, 2006"}}</span>
                        </div>
                    </div>
                    {{else}}
                    <div class="feedemt" style="grid-column: 1 / -1;">You haven't created any shop items yet.</div>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/assets/assets.js?v={{.AssetV}}"></script>

<!DOCTYPE html>
<html lang="en"{{if .ViewerReducedMotion}} class="reduced-motion"{{end}}>
<head>
    {{template "components/layout/head" .}}
</head>
<body hx-boost="true">
    {{template "components/layout/navbar" .}}
    <div id="pageProgress" class="page-progress" aria-hidden="true"><div class="page-progress-bar"></div></div>
    <div id="rateLimitBanner" class="ratelimit" role="alert" aria-live="assertive" hidden>
        <i class="fa-solid fa-hourglass-half" aria-hidden="true"></i>
        <span class="ratelimit-msg">Slow down. You are being rate limited.</span>
        <span class="ratelimit-timer">Try again in <span id="rateLimitSeconds">60</span>s</span>
        <button type="button" class="ratelimit-close" aria-label="Dismiss" onclick="window.dismissRateLimit()">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
    {{embed}}
    {{template "components/layout/footer"}}
    {{template "elements/modal"}}
    <div id="globalLoader" class="global-loader" aria-hidden="true" role="status" aria-label="Loading">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="global-spin-svg">
            <defs>
                <linearGradient id="globalSpinLeading" x1="50%" x2="50%" y1="5.271%" y2="91.793%">
                    <stop offset="0%" stop-color="currentColor" />
                    <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                </linearGradient>
                <linearGradient id="globalSpinTrailing" x1="50%" x2="50%" y1="15.24%" y2="87.15%">
                    <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
                    <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                </linearGradient>
            </defs>
            <g fill="none">
                <path d="M8.749.021a1.5 1.5 0 0 1 .497 2.958A7.5 7.5 0 0 0 3 10.375a7.5 7.5 0 0 0 7.5 7.5v3c-5.799 0-10.5-4.7-10.5-10.5C0 5.23 3.726.865 8.749.021" fill="url(#globalSpinLeading)" transform="translate(1.5 1.625)" />
                <path d="M15.392 2.673a1.5 1.5 0 0 1 2.119-.115A10.48 10.48 0 0 1 21 10.375c0 5.8-4.701 10.5-10.5 10.5v-3a7.5 7.5 0 0 0 5.007-13.084a1.5 1.5 0 0 1-.115-2.118" fill="url(#globalSpinTrailing)" transform="translate(1.5 1.625)" />
            </g>
        </svg>
    </div>
</body>
</html>

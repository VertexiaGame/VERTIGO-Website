<article class="forum-post forum-thread-item" data-thread-id="{{.ID}}" data-thread-title="{{.Title}}" data-thread-author="{{.Author}} {{.AuthorUsername}}">
    <a href="/user/{{.UserID}}" hx-get="/user/{{.UserID}}" hx-target="body" hx-push-url="true" class="forum-post-avatar" aria-label="View {{.Author}}'s profile">
        <img src="/avatar/{{.UserID}}.png" onerror="this.onerror=null;this.src='/static/useful/temp/pfp.png';" alt="" loading="lazy">
    </a>
    <div class="forum-post-main">
        <div class="forum-post-head">
            <div class="forum-post-meta">
                <span class="forum-post-author">{{template "components/clan/tag" .Tag}}<a href="/user/{{.UserID}}" hx-get="/user/{{.UserID}}" hx-target="body" hx-push-url="true" class="forum-post-author-name">{{.Author}}</a></span>
                <span class="ttpcnt forum-post-time" tabindex="0" aria-label="Posted {{.FullDate}}"><span>Posted {{.TimeAgo}}</span><span class="ttptxt" aria-hidden="true">{{.FullDate}}</span></span>
            </div>
        </div>
        <h2 class="forum-post-title"><a class="forum-thread-title" href="{{.Path}}" hx-get="{{.Path}}" hx-target="body" hx-push-url="true">{{.Title}}</a></h2>
        {{if .Excerpt}}<p class="forum-post-body">{{.Excerpt}}</p>{{end}}
        <div class="forum-thread-meta forum-post-footer">
            <span><i class="fa-solid fa-reply" aria-hidden="true"></i> {{.RepliesLabel}}</span>
            {{if .Pinned}}<span><i class="fa-solid fa-thumbtack" aria-hidden="true"></i> Pinned</span>{{end}}
            {{if .Locked}}<span><i class="fa-solid fa-lock" aria-hidden="true"></i> Locked</span>{{end}}
        </div>
    </div>
</article>
